[workspace]
resolver = "3"
members = ["crates/core", "crates/wasm", "src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Tests run the simulator for thousands of steps; keep them fast without a release build.
[profile.dev.package."*"]
opt-level = 2
[profile.test]
opt-level = 2
