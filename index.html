<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="description" content="مختبر الدوائر الذكية (Smart Circuit Lab): نبض: مختبر محاكاة الدوائر الكهربائية والإلكترونية لطلاب التعليم المهني" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>مختبر الدوائر الذكية · Smart Circuit Lab</title>
    <style>
      /* Splash styles live here so the opening screen shows before anything else loads. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f19;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        color: #e5ecf6;
        font-family: 'Readex Pro', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
        background:
          radial-gradient(60% 50% at 50% 42%, rgba(56, 189, 248, 0.14), transparent 70%),
          linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px) 0 0 / 28px 28px,
          linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px) 0 0 / 28px 28px,
          #070b14;
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
        cursor: pointer;
      }
      #splash.done {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      .sp-center {
        display: grid;
        justify-items: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .sp-logo {
        display: block;
        width: 84px;
        height: 84px;
        margin: 0 auto 6px;
      }
      .sp-pulse {
        width: min(360px, 78vw);
        height: auto;
        overflow: visible;
      }
      .sp-pulse path {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sp-base {
        stroke: rgba(148, 163, 184, 0.18);
        stroke-width: 3;
      }
      .sp-trace {
        stroke: #38bdf8;
        stroke-width: 4;
        stroke-dasharray: 90 520;
        filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.9));
        animation: sp-run 1.7s cubic-bezier(0.5, 0, 0.3, 1) infinite;
      }
      @keyframes sp-run {
        from {
          stroke-dashoffset: 90;
        }
        to {
          stroke-dashoffset: -520;
        }
      }
      .sp-name {
        margin: 6px 0 0;
        font-size: clamp(30px, 7.5vw, 64px);
        white-space: nowrap;
        font-weight: 700;
        line-height: 1.35;
        letter-spacing: -0.01em;
        background: linear-gradient(180deg, #ffffff 20%, #bae6fd 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sp-rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .sp-latin {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 13px;
        letter-spacing: 0.5em;
        color: #7dd3fc;
        margin-inline-start: 0.5em;
        animation: sp-rise 0.9s 0.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .sp-tag {
        margin: 0;
        font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
        font-size: 17px;
        color: #a9b7cc;
        animation: sp-rise 0.9s 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes sp-rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }
      .sp-load {
        display: grid;
        gap: 8px;
        width: min(280px, 70vw);
        margin-top: 18px;
        animation: sp-rise 0.9s 0.3s both;
      }
      .sp-bar {
        height: 5px;
        border-radius: 99px;
        background: rgba(148, 163, 184, 0.16);
        overflow: hidden;
      }
      .sp-bar i {
        display: block;
        height: 100%;
        width: 4%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0ea5e9, #7dd3fc);
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
        transition: width 0.35s ease;
      }
      .sp-row {
        display: flex;
        justify-content: space-between;
        font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
        font-size: 13px;
        color: #8a99b0;
      }
      .sp-pct {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        direction: ltr;
      }
      .sp-foot {
        position: absolute;
        bottom: max(24px, env(safe-area-inset-bottom));
        inset-inline: 0;
        margin: 0;
        text-align: center;
        font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
        font-size: 13px;
        color: #64748b;
      }
      @media (prefers-reduced-motion: reduce) {
        .sp-trace,
        .sp-name,
        .sp-latin,
        .sp-tag,
        .sp-load {
          animation: none;
        }
        .sp-trace {
          stroke-dasharray: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <div class="sp-center">
        <svg class="sp-logo" viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="26" fill="#1f2937"/><g fill="#9ca3af"><rect x="20" y="44" width="12" height="5" rx="1.5"/><rect x="20" y="58" width="12" height="5" rx="1.5"/><rect x="20" y="72" width="12" height="5" rx="1.5"/><rect x="88" y="44" width="12" height="5" rx="1.5"/><rect x="88" y="58" width="12" height="5" rx="1.5"/><rect x="88" y="72" width="12" height="5" rx="1.5"/></g><rect x="32" y="32" width="56" height="56" rx="10" fill="none" stroke="#e8eef2" stroke-width="5"/><path d="M40 60 L46 50 L52 70 L58 50 L64 70 L70 50 L76 70 L80 60" fill="none" stroke="#f5b400" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="40" cy="40" r="2.5" fill="#e8eef2"/></svg>
        <svg class="sp-pulse" viewBox="0 0 360 90" aria-hidden="true">
          <path class="sp-base" d="M4 50H136l6-14 12 28 12-28 12 28 12-28 12 28 6-14H356" />
          <path class="sp-trace" d="M4 50H136l6-14 12 28 12-28 12 28 12-28 12 28 6-14H356" pathLength="520" />
        </svg>
        <h1 class="sp-name">مختبر الدوائر الذكية</h1>
        <div class="sp-latin">SMART CIRCUIT LAB</div>
        <p class="sp-tag">محاكاة الدوائر الكهربائية والإلكترونية</p>
        <div class="sp-load">
          <div class="sp-bar"><i></i></div>
          <div class="sp-row"><span class="sp-status">جارٍ التحميل…</span><span class="sp-pct">0%</span></div>
        </div>
      </div>
      <p class="sp-foot">إعداد: المهندس علي نجم</p>
    </div>

    <div id="app">
      <header class="top">
        <button class="brand" title="الصفحة الرئيسية">
          <svg class="brand-mark" viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="26" fill="#1f2937"/><g fill="#9ca3af"><rect x="20" y="44" width="12" height="5" rx="1.5"/><rect x="20" y="58" width="12" height="5" rx="1.5"/><rect x="20" y="72" width="12" height="5" rx="1.5"/><rect x="88" y="44" width="12" height="5" rx="1.5"/><rect x="88" y="58" width="12" height="5" rx="1.5"/><rect x="88" y="72" width="12" height="5" rx="1.5"/></g><rect x="32" y="32" width="56" height="56" rx="10" fill="none" stroke="#e8eef2" stroke-width="5"/><path d="M40 60 L46 50 L52 70 L58 50 L64 70 L70 50 L76 70 L80 60" fill="none" stroke="#f5b400" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="40" cy="40" r="2.5" fill="#e8eef2"/></svg>
          <span class="brand-text"><strong>مختبر الدوائر الذكية</strong><small>Smart Circuit Lab</small></span>
        </button>
        <nav class="tools" id="tools" aria-label="الأدوات"></nav>
      </header>
      <div class="workspace">
        <aside class="palette panel" id="palette"></aside>
        <main class="stage" id="stage">
          <div class="lesson" id="lesson" hidden></div>
          <div class="lesson challenge" id="challenge" hidden></div>
        </main>
        <aside class="side" id="side">
          <section id="inspector" class="card"></section>
          <section id="doctor" class="card"></section>
        </aside>
        <section class="scope" id="scope" hidden></section>
      </div>
    </div>
    <div id="modal" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
