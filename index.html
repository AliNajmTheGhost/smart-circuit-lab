<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#13222b" />
    <meta name="description" content="نبض: مختبر محاكاة الدوائر الكهربائية والإلكترونية لطلاب التعليم المهني" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>نبض · مختبر الدوائر</title>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M2 17h7l3-9 5 16 3-9 2 2h8" /></svg>
          <div><strong>نبض</strong><span>Nabd</span></div>
        </div>
        <nav class="tools" id="tools" aria-label="الأدوات"></nav>
      </header>
      <aside class="palette" id="palette"></aside>
      <main class="stage" id="stage">
        <div class="status" id="status"></div>
        <div class="lesson" id="lesson" hidden></div>
      </main>
      <aside class="side" id="side">
        <section id="inspector" class="card"></section>
        <section id="doctor" class="card"></section>
      </aside>
      <section class="scope" id="scope" hidden></section>
    </div>
    <div id="modal" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
